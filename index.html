    <script>
      // Resolve theme and language before the first paint, so a dark-mode or
      // Chinese-language visitor never sees a flash of the wrong state.
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('preferred-theme');
          const dark = savedTheme === 'dark' || (savedTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          const theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b131b' : '#ffffff');

          const savedLang = localStorage.getItem('preferred-language');
          const zh = savedLang === 'zh';
          document.documentElement.lang = zh ? 'zh-CN' : 'en';
          if (zh) {
            document.title = '吴世涵 | 北京智源人工智能研究院 具身智能研究员';
          }
        } catch (_) {}
      })();
